<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Military Force - Online Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            display: none;
        }

        #gameContainer.active {
            display: block;
        }

        #gameCanvas {
            display: block;
            background: #0a0a0a;
        }

        #menuScreen {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            text-align: center;
        }

        #menuScreen.hidden {
            display: none;
        }

        h1 {
            font-size: 64px;
            color: #ff6600;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255, 102, 0, 0.5);
        }

        .menu-subtitle {
            font-size: 20px;
            color: #ccc;
            margin-bottom: 40px;
        }

        .btn-play {
            background-color: #ff6600;
            color: #000;
            padding: 15px 50px;
            border: none;
            font-size: 18px;
            text-transform: uppercase;
            cursor: pointer;
            font-weight: bold;
            margin: 10px;
            transition: all 0.3s;
            border-radius: 5px;
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.3);
        }

        .btn-play:hover {
            background-color: #ffaa44;
            box-shadow: 0 6px 20px rgba(255, 102, 0, 0.5);
            transform: scale(1.05);
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            color: #ff6600;
            font-size: 18px;
            font-weight: bold;
            z-index: 100;
        }

        .hud-left {
            display: flex;
            gap: 30px;
        }

        .hud-right {
            display: flex;
            gap: 30px;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            z-index: 200;
            display: none;
            border: 3px solid #ff6600;
        }

        #gameOver.active {
            display: block;
        }

        #gameOver h2 {
            color: #ff6600;
            font-size: 36px;
            margin-bottom: 20px;
        }

        #gameOver p {
            font-size: 20px;
            margin: 10px 0;
        }

        .crosshair {
            position: absolute;
            width: 30px;
            height: 30px;
            pointer-events: none;
            z-index: 1000;
        }

        .crosshair::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 10px;
            background: #ff6600;
            transform: translateX(-50%);
        }

        .crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            height: 2px;
            width: 10px;
            background: #ff6600;
            transform: translateY(-50%);
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 14px;
            color: #ccc;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <!-- Menu Screen -->
    <div id="menuScreen">
        <h1>Mobile Military Force</h1>
        <p class="menu-subtitle">Online FPS Action Game</p>
        <button class="btn-play" onclick="startGame()">PLAY NOW</button>
        <button class="btn-play" onclick="showInstructions()">INSTRUCTIONS</button>
    </div>

    <!-- Game Container -->
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="hud">
            <div class="hud-left">
                <div>Score: <span id="score">0</span></div>
                <div>Health: <span id="health">100</span>%</div>
                <div>Ammo: <span id="ammo">30</span></div>
            </div>
            <div class="hud-right">
                <div>Wave: <span id="wave">1</span></div>
                <div>Enemies: <span id="enemyCount">0</span></div>
            </div>
        </div>

        <div id="gameOver">
            <h2>GAME OVER</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <p>Enemies Defeated: <span id="enemiesDefeated">0</span></p>
            <button class="btn-play" onclick="location.reload()">PLAY AGAIN</button>
        </div>

        <div class="instructions">
            <strong>Controls:</strong><br>
            • Mouse: Look Around<br>
            • Click: Shoot<br>
            • WASD: Move<br>
            • Space: Jump<br>
            • Shift: Run<br>
            • R: Reload
        </div>

        <div class="crosshair"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Game Variables
        let gameActive = false;
        let player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            width: 30,
            height: 40,
            velocityY: 0,
            velocityX: 0,
            health: 100,
            maxHealth: 100,
            speed: 5,
            jumping: false,
            angle: 0
        };

        let keys = {};
        let bullets = [];
        let enemies = [];
        let score = 0;
        let ammo = 30;
        let maxAmmo = 30;
        let wave = 1;
        let gameOver = false;
        let enemiesKilled = 0;

        // Enemy Class
        class Enemy {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 25;
                this.height = 35;
                this.health = 50;
                this.maxHealth = 50;
                this.speed = 2 + wave * 0.5;
                this.angle = Math.atan2(player.y - this.y, player.x - this.x);
            }

            update() {
                this.angle = Math.atan2(player.y - this.y, player.x - this.x);
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                // Enemy body
                ctx.fillStyle = '#ff3333';
                ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
                
                // Enemy eyes
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(-8, -8, 4, 4);
                ctx.fillRect(4, -8, 4, 4);
                
                ctx.restore();

                // Health bar
                ctx.fillStyle = '#333';
                ctx.fillRect(this.x - 15, this.y - 25, 30, 4);
                ctx.fillStyle = '#ff3333';
                ctx.fillRect(this.x - 15, this.y - 25, (this.health / this.maxHealth) * 30, 4);
            }

            isHit(bullet) {
                return bullet.x > this.x - this.width / 2 &&
                       bullet.x < this.x + this.width / 2 &&
                       bullet.y > this.y - this.height / 2 &&
                       bullet.y < this.y + this.height / 2;
            }
        }

        // Bullet Class
        class Bullet {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.speed = 8;
                this.radius = 3;
            }

            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
            }

            draw() {
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Bullet trail
                ctx.strokeStyle = 'rgba(255, 255, 0, 0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - Math.cos(this.angle) * 10, this.y - Math.sin(this.angle) * 10);
                ctx.stroke();
            }

            isOutOfBounds() {
                return this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height;
            }
        }

        // Event Listeners
        window.addEventListener('mousemove', (e) => {
            const dx = e.clientX - player.x;
            const dy = e.clientY - player.y;
            player.angle = Math.atan2(dy, dx);
        });

        window.addEventListener('click', () => {
            if (gameActive && !gameOver && ammo > 0) {
                bullets.push(new Bullet(player.x, player.y, player.angle));
                ammo--;
            }
        });

        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === 'r' || e.key === 'R') reload();
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        function reload() {
            ammo = maxAmmo;
        }

        function spawnEnemies() {
            const enemyCount = 3 + wave * 2;
            for (let i = 0; i < enemyCount; i++) {
                let x, y;
                do {
                    x = Math.random() * canvas.width;
                    y = Math.random() * canvas.height;
                } while (Math.hypot(x - player.x, y - player.y) < 150);
                enemies.push(new Enemy(x, y));
            }
        }

        function updatePlayer() {
            let moveX = 0;
            let moveY = 0;
            const moveSpeed = keys['shift'] ? player.speed * 1.5 : player.speed;

            if (keys['w']) moveY -= moveSpeed;
            if (keys['s']) moveY += moveSpeed;
            if (keys['a']) moveX -= moveSpeed;
            if (keys['d']) moveX += moveSpeed;

            player.x += moveX;
            player.y += moveY;

            // Boundary check
            player.x = Math.max(0, Math.min(canvas.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height, player.y));
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);

            // Player body
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);

            // Gun
            ctx.fillStyle = '#666';
            ctx.fillRect(10, -5, 20, 10);

            ctx.restore();

            // Health indicator
            ctx.fillStyle = '#333';
            ctx.fillRect(player.x - 20, player.y - 35, 40, 4);
            ctx.fillStyle = player.health > 50 ? '#00ff00' : player.health > 25 ? '#ffff00' : '#ff3333';
            ctx.fillRect(player.x - 20, player.y - 35, (player.health / player.maxHealth) * 40, 4);
        }

        function update() {
            if (!gameActive || gameOver) return;

            updatePlayer();

            // Update bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].update();
                if (bullets[i].isOutOfBounds()) {
                    bullets.splice(i, 1);
                }
            }

            // Update enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].update();

                // Enemy collision with player
                if (Math.hypot(enemies[i].x - player.x, enemies[i].y - player.y) < 30) {
                    player.health -= 1;
                    if (player.health <= 0) {
                        endGame();
                    }
                }

                // Bullet collision with enemy
                for (let j = bullets.length - 1; j >= 0; j--) {
                    if (enemies[i].isHit(bullets[j])) {
                        enemies[i].health -= 25;
                        bullets.splice(j, 1);

                        if (enemies[i].health <= 0) {
                            enemies.splice(i, 1);
                            score += 100;
                            enemiesKilled++;

                            if (enemies.length === 0 && wave < 5) {
                                wave++;
                                spawnEnemies();
                            }
                        }
                        break;
                    }
                }
            }

            // Update HUD
            document.getElementById('score').textContent = score;
            document.getElementById('health').textContent = Math.ceil(player.health);
            document.getElementById('ammo').textContent = ammo;
            document.getElementById('wave').textContent = wave;
            document.getElementById('enemyCount').textContent = enemies.length;
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = 'rgba(255, 102, 0, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 50) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Draw game elements
            drawPlayer();

            for (let bullet of bullets) {
                bullet.draw();
            }

            for (let enemy of enemies) {
                enemy.draw();
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('gameContainer').classList.add('active');
            gameActive = true;
            gameOver = false;
            score = 0;
            wave = 1;
            enemiesKilled = 0;
            player.health = 100;
            ammo = maxAmmo;
            bullets = [];
            enemies = [];
            spawnEnemies();
            gameLoop();
        }

        function endGame() {
            gameOver = true;
            gameActive = false;
            document.getElementById('gameOver').classList.add('active');
            document.getElementById('finalScore').textContent = score;
            document.getElementById('enemiesDefeated').textContent = enemiesKilled;
        }

        function showInstructions() {
            alert('MOBILE MILITARY FORCE\n\nControls:\n• Mouse: Aim\n• Click: Shoot\n• WASD: Move\n• Shift: Run\n• R: Reload\n\nObjective:\nDefeat all enemies in each wave to progress.\nSurvive 5 waves to win!\n\nGood luck soldier!');
        }
    </script>
</body>
</html>
